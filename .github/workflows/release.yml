name: Release

# Creates installers for Windows and macOS and publishes a GitHub release.
# Trigger: push a tag, e.g.  git tag v0.2.0 && git push origin v0.2.0
# The tag must match frameforge/__init__.py (__version__).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Release veröffentlichen (Tag v<Version> aus frameforge/__init__.py wird angelegt)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest      # Apple Silicon (arm64)
            target: macos-arm64
          - os: macos-15-intel    # Intel Macs
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r packaging/requirements-build.txt
          pip install --no-deps -e .
      - name: Version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import frameforge; print(frameforge.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu __version__ $VERSION"; exit 1
          fi
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Icons
        run: python packaging/make_icons.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/frameforge.spec
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$default\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:Path += ";$default"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\windows\installer.iss
      - name: macOS DMG
        if: runner.os == 'macOS'
        run: packaging/macos/build_dmg.sh "${{ steps.version.outputs.version }}" "${{ matrix.target == 'macos-arm64' && 'arm64' || 'x86_64' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then TAG="${GITHUB_REF_NAME}"; else
            TAG="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' frameforge/__init__.py)"; fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG existiert bereits – Version in frameforge/__init__.py erhöhen"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release: $TAG"
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"; VERSION="${VERSION#v}"
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Siehe CHANGELOG.md" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        continue-on-error: true  # a single failed platform must not block the others
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          if [ ! -d assets ] || [ -z "$(ls -A assets)" ]; then echo "Keine Installationspakete gebaut"; exit 1; fi
          cd assets
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FrameForge ${{ steps.tag.outputs.tag }}
          files: assets/*
          body_path: notes.md
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
